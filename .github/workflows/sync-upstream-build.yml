name: Sync latest Prism and build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    if: github.repository == 'Archimetrix/Prism' && github.ref == 'refs/heads/codex/spotify-canvas'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Spotify Canvas branch
        uses: actions/checkout@v4
        with:
          ref: codex/spotify-canvas
          fetch-depth: 0

      - name: Set commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge latest Prism main
        run: |
          git remote add upstream https://github.com/Yigder/Prism.git
          git fetch upstream main
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::The upstream update has conflicts. No changes were pushed; the Spotify Canvas branch is unchanged."
            exit 1
          fi

      - name: Push the synced branch
        run: git push origin HEAD:refs/heads/codex/spotify-canvas

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-37.0"
          ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"

      - name: Set up the persistent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::The persistent signing key secrets are missing from this fork's Actions settings."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prism-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/prism-release.jks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prism-spotify-canvas-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
